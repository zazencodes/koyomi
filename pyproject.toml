[project]
name = "koyomi"
version = "0.2.0"
description = "Small job scheduler for a few machines, with plain-JSON state on a hub"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
koyomi = "koyomi:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["koyomi"]
